<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Music</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap');

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: #062f32;
    font-family: "DM Sans", sans-serif;
    position: relative;
}


/* =========================
   WAVY BACKGROUND
========================= */

.background {
    position: fixed;
    inset: -20%;
    width: 140%;
    height: 140%;

    background:
        radial-gradient(
            ellipse at 30% 40%,
            rgba(17, 105, 102, 0.7),
            transparent 45%
        ),
        radial-gradient(
            ellipse at 70% 60%,
            rgba(4, 64, 71, 0.9),
            transparent 50%
        ),
        linear-gradient(
            135deg,
            #062f32,
            #06484a,
            #052c38
        );

    animation: water 18s ease-in-out infinite alternate;

    filter: blur(30px);
    transform-origin: center;
}


@keyframes water {

    0% {
        transform:
            scale(1)
            translate(0px, 0px)
            rotate(0deg);
    }

    50% {
        transform:
            scale(1.08)
            translate(-3%, 2%)
            rotate(1deg);
    }

    100% {
        transform:
            scale(1.12)
            translate(3%, -2%)
            rotate(-1deg);
    }
}


/* =========================
   BLOBS
========================= */

.blob {

    position: absolute;

    width: 70px;
    height: 70px;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #062f32;

    font-size: 12px;
    font-weight: 500;

    text-align: center;

    cursor: pointer;

    /* makes the shape organic */
    border-radius:
        63% 37% 54% 46%
        /
        45% 55% 45% 55%;

    transition:
        transform 0.5s cubic-bezier(.2,.8,.2,1),
        border-radius 0.6s ease,
        filter 0.4s ease;

    animation:
        float 7s ease-in-out infinite;

    z-index: 2;

    /* text is cut out */
    mix-blend-mode: screen;
}


/* Hover */

.blob:hover {

    transform:
        scale(2.2)
        rotate(8deg);

    border-radius:
        40% 60% 55% 45%
        /
        60% 40% 60% 40%;

    filter:
        brightness(1.25)
        blur(0px);

    z-index: 10;
}


/* =========================
   FLOATING
========================= */

@keyframes float {

    0% {
        margin-top: 0px;
        margin-left: 0px;
    }

    25% {
        margin-top: -8px;
        margin-left: 5px;
    }

    50% {
        margin-top: 4px;
        margin-left: -7px;
    }

    75% {
        margin-top: -5px;
        margin-left: 4px;
    }

    100% {
        margin-top: 0px;
        margin-left: 0px;
    }
}


/* =========================
   GENRES
========================= */

.electronic {
    background: #e46cff;
}

.ambient {
    background: #54e6c1;
}

.rock {
    background: #ff765c;
}

.experimental {
    background: #ffd45c;
}

.folk {
    background: #9bd96d;
}


/* Slightly different movement */

.blob:nth-child(2) {
    animation-delay: -2s;
}

.blob:nth-child(3) {
    animation-delay: -4s;
}

.blob:nth-child(4) {
    animation-delay: -1s;
}

.blob:nth-child(5) {
    animation-delay: -5s;

}


/* =========================
   SONG POSITIONS
========================= */

.song1 {
    left: 30%;
    top: 35%;
}

.song2 {
    left: 40%;
    top: 43%;
}

.song3 {
    left: 50%;
    top: 32%;
}

.song4 {
    left: 58%;
    top: 47%;
}

.song5 {
    left: 67%;
    top: 38%;
}

</style>
</head>


<body>

<div class="background"></div>


<div
    class="blob electronic song1"
    onclick="playSong('song1.mp3')">
    SONG ONE
</div>


<div
    class="blob ambient song2"
    onclick="playSong('song2.mp3')">
    SONG TWO
</div>


<div
    class="blob rock song3"
    onclick="playSong('song3.mp3')">
    SONG THREE
</div>


<div
    class="blob experimental song4"
    onclick="playSong('song4.mp3')">
    SONG FOUR
</div>


<div
    class="blob folk song5"
    onclick="playSong('song5.mp3')">
    SONG FIVE
</div>


<script>

function playSong(song) {

    console.log("Playing:", song);

}

</script>

</body>
</html>
